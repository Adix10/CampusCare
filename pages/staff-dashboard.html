<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Work Queue — CampusCare</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">

  <!-- Shared Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Main -->
  <div class="main-content">
    <header class="topbar">
      <button id="navToggle" aria-label="Toggle navigation">☰</button>
      <div class="topbar-title">Staff Work Queue</div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <h1 id="staffGreeting">Work Queue</h1>
        <p>Complaints assigned to you. Click a card to view details and update status.</p>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- Filters -->
      <div class="filters-bar">
        <div class="filter-group">
          <label for="fSearch">Search</label>
          <input type="text" id="fSearch" placeholder="Title, ID, location…">
        </div>
        <div class="filter-group">
          <label for="fStatus">Status</label>
          <select id="fStatus">
            <option value="all">All</option>
            <option>Assigned</option>
            <option>In Progress</option>
            <option>Waiting</option>
            <option>Resolved</option>
            <option>Closed</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="fPriority">Priority</label>
          <select id="fPriority">
            <option value="all">All</option>
            <option>Urgent</option><option>High</option><option>Normal</option><option>Low</option>
          </select>
        </div>
      </div>

      <div id="resultCount" style="font-size:.82rem;color:var(--text-muted);margin-bottom:12px"></div>
      <div class="complaint-grid" id="queue"></div>
    </main>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
var user = requireAuth(["staff"]);
if (user) {
  buildSidebar(user, "staff-queue");
  initMobileNav();

  document.getElementById("staffGreeting").textContent = "Hello, " + user.name.split(" ")[0] + "! 👷";

  var complaints = loadComplaints();
  // Filter strictly by assignedToId
  var myQueue = complaints.filter(function(c) {
    return c.assignedToId === user.id;
  });

  var statsGrid = document.getElementById("statsGrid");
  statsGrid.innerHTML =
    '<div class="stat-card"><div class="stat-num">' + myQueue.length + '</div><div class="stat-label">Assigned</div></div>' +
    '<div class="stat-card"><div class="stat-num">' + countByStatus(myQueue,"In Progress") + '</div><div class="stat-label">In Progress</div></div>' +
    '<div class="stat-card"><div class="stat-num">' + countByStatus(myQueue,"Waiting") + '</div><div class="stat-label">Waiting</div></div>' +
    '<div class="stat-card"><div class="stat-num">' + countByStatus(myQueue,"Resolved") + '</div><div class="stat-label">Resolved</div></div>';

  function applyFilters() {
    var filtered = filterComplaints(myQueue, {
      status:   document.getElementById("fStatus").value,
      priority: document.getElementById("fPriority").value,
      search:   document.getElementById("fSearch").value
    });
    document.getElementById("resultCount").textContent = filtered.length + " task(s) found";
    renderList(document.getElementById("queue"), filtered, "No tasks match your filters.");
  }

  wireFilters(["fSearch","fStatus","fPriority"], applyFilters);
  applyFilters();
}
</script>
</body>
</html>
