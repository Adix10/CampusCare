<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — CampusCare</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">

  <!-- Shared Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Main -->
  <div class="main-content">
    <header class="topbar">
      <button id="navToggle" aria-label="Toggle navigation">☰</button>
      <div class="topbar-title">Student Dashboard</div>
      <div class="topbar-actions">
        <a href="submit-complaint.html" class="btn btn-primary btn-sm">+ New Complaint</a>
      </div>
    </header>

    <main class="page-content">
      <!-- Greeting -->
      <div class="page-header">
        <h1 id="greeting">Hello!</h1>
        <p id="sapDisplay"></p>
      </div>

      <!-- KPI cards -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- Recent complaints -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <h2>Recent Complaints</h2>
        <a href="my-complaints.html" class="btn btn-secondary btn-sm">View All →</a>
      </div>
      <div class="complaint-grid" id="recentGrid"></div>
    </main>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
var user = requireAuth(["student"]);
if (user) {
  buildSidebar(user, "dashboard");
  initMobileNav();

  document.getElementById("greeting").textContent = "Hello, " + user.name.split(" ")[0] + "! 👋";
  document.getElementById("sapDisplay").textContent = "SAP ID: " + user.id + " · " + (user.branch || "") + " · Year " + (user.year || "");

  var complaints = loadComplaints();
  var mine = filterComplaints(complaints, { userId: user.id });

  var statuses = ["Submitted","Assigned","In Progress","Waiting","Resolved","Closed"];
  renderStats(document.getElementById("statsGrid"), mine, statuses);

  var recent = mine.slice().sort(function(a,b){ return new Date(b.updatedAt) - new Date(a.updatedAt); }).slice(0,4);
  renderList(document.getElementById("recentGrid"), recent, "No complaints yet. Submit your first one!");
}
</script>
</body>
</html>
